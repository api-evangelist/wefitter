      in: path
      required: true
      type: string
    get:
      operationId: profile_challenge
      summary: Challenge
      description: 'Provides a list of challenges where the profile can participate and is already participating in.


        This endpoint returns a list of objects.

        '
      parameters:
      - name: recent
        in: query
        description: Show challenges that have not ended in the last N weeks
        required: false
        type: integer
      - name: date_start
        in: query
        description: 'Only return challenges that are active after this time


          Note: this only affects challenges that are not joined.


          Defaults to now'
        required: false
        type: string
        format: date-time
        x-nullable: true
      - name: date_end
        in: query
        description: 'Only return challenges that are active before this time


          Note: this only affects challenges that are not joined.


          Defaults to now'
        required: false
        type: string
        format: date-time
        x-nullable: true
      responses:
