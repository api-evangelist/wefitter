  /profile/{public_id}/connections/:
    parameters:
    - name: public_id
      in: path
      required: true
      type: string
    get:
      operationId: profile_connections
      summary: Connections
      description: 'Lists the connections available for a profile and their "state".

        This endpoint returns a list of objects.

        '
      parameters:
      - name: redirect
        in: query
        description: 'After connecting redirect back to this url.


          Note: has to be a valid http url. For deeplinks (to apps) first redirect to your own backend and then deeplink from there.


          Note: the user is only redirected on a successfull connection, otherwise an error screen is shown. (see redirect_on_error to change this)


          Note: if this parameter is omitted, then user will see a generic success screen.'
        required: false
        type: string
        minLength: 1
      - name: redirect_on_error
        in: query
        description: 'If enabled, then user will also be redirected to the redirect url if an error occurs


          Note: a query parameter ''error'' is added to the redirect url. Possible values are access_denied, unknown. New values may be added at anytime


          Note: for backwards compatibility the default is false, but this will be changed in the next breaking release'
        required: false
        type: boolean
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/ProfileAppConnectionList'
      tags:
      - profile
      deprecated: false
