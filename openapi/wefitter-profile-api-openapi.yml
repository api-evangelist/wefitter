        - STREAK
        - STICKTOIT
        - GOALBREAKER
      avatar:
        title: Avatar
        type: string
        format: uri
        minLength: 1
        x-nullable: true
      data_source:
        title: Data source
        type: string
        readOnly: true
        minLength: 1
      activity_types:
        type: array
        items:
          $ref: '#/definitions/ChallengeActivityType'
      current_period_start:
