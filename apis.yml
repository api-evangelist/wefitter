aid: wefitter
name: WeFitter
description: >-
  WeFitter is a health and fitness data platform ("one API to access wearable data,
  gamification and AI") operated by Thunderbyte.AI in Groningen, Netherlands. Its
  REST API aggregates health and activity data from 300+ wearables and fitness apps
  — Fitbit, Garmin, Google Fit, Apple Health, Withings, Polar, Oura, Whoop, Samsung
  Health, Huawei and more — into a single unified, deduplicated data model, and
  layers gamification (challenges, leaderboards, teams, points) and AI insights
  (biological age, recommendations) on top. Organizations use it to build corporate
  wellbeing, digital fitness, e-health and insurance solutions. WeFitter also ships
  mobile SDK bridges for Apple Health, Samsung Health and Android Health Connect.
