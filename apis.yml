- aid: wefitter:wefitter-profile-api
  name: WeFitter profile API
  description: >-
    Profiles are containers for wearables data.

    The profiles can be seen as an extension of users in a different system.

    Profiles are anonymous objects which can participate in teams and challenges.


    Keep in mind, listing profiles and creating profiles need an administrative bearer token, all profile
    specific actions

    need a seperate bearer token that is returned after creating a profile. This bearer token is used
    in place of the

    administrative bearer token. (see profile create action for more information)
