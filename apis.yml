- aid: wefitter:wefitter-challenge-api
  name: WeFitter challenge API
  description: >-
    WeFitter API’s challenge engine will bring endless engagement to your platform.

    For more information about the possibilities in challenges please go to https://www.wefitter.com/en-us/features/gamification/


    Challenges have multilanguage support on the fields: `Title`, `Slogan`, and `Description`.

    By default, challenges get the default-language that is configured in the app. Whenever a challenge
    is requested through the API this challenge will be presented in the default language.

    If another language is preferred, this can be requested by adding the header parameter `Accept-Language`
    stating the language short code (ex. `en` for english). If this language short code is not present
    in the title of the challenge, the default language will be returned.


    These translation fields contain JSON strings, for example:

    ```{"en":"this is the English title","nl":"this is the Dutch title"}```

    So to create a multilanguage challenge, please provide the title, slogan, and description field as
    json strings, be aware that because of serialization this should be formed with backward slashes:



    <table><tbody>
        <tr><td>
    {


    "title": "{\"en\":\"this is the English title\", \"nl\":\"this is the dutch title\"}",


    "slogan": "{\"en\":\"this is the English title\", \"nl\":\"this is the dutch slogan\"}",


    "description": "{\"en\":\"this is the English title\", \"nl\":\"this is the dutch description\"}",


    }

    </td></tr>

    </tbody></table>
  humanURL: https://www.wefitter.com/en-us/developers/
  baseURL: https://api.wefitter.com/api/v1.3
  tags:
