notes: >-
  WeFitter ships first-party mobile SDK bridges for collecting on-device health
  data (Apple Health, Samsung Health, Android Health Connect) and forwarding it
  to the WeFitter API. They are published as source in the github.com/wefitter
  org and distributed to customers on request; none are indexed on npm, PyPI or
  pub.dev at time of probe (all returned 404). No server-side REST client SDK is
  published — the REST API is consumed directly over HTTPS with bearer tokens.
